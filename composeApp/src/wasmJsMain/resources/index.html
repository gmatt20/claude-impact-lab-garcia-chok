<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1F5C4E">
    <title>Bridge</title>
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #FBF8F3; }
        #print-root { display: none; }
        @media print {
            html, body { overflow: visible; height: auto; background: #fff; }
            body > *:not(#print-root) { display: none !important; }
            #print-root { display: block; font: 14pt/1.45 Georgia, "Times New Roman", serif; color: #000; }
            #print-root .card { max-width: 7in; margin: 0 auto; }
            #print-root .brand { font: 600 11pt system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 4pt; }
            #print-root h1 { font-size: 22pt; margin: 0 0 8pt; }
            #print-root h2 { font-size: 15pt; margin: 14pt 0 4pt; border-bottom: 1px solid #000; }
            #print-root .big { font-size: 20pt; font-weight: 700; margin: 4pt 0; }
            #print-root .note { border: 1.5px solid #000; padding: 6pt 8pt; }
            #print-root .small { font-size: 10.5pt; }
            #print-root li { margin: 3pt 0; }
            @page { margin: 0.6in; }
        }
    </style>
    <script>
        // Offline support: cache the app shell after first visit. Registration failure is harmless.
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
        }
    </script>
    <script type="application/javascript" src="composeApp.js"></script>
</head>
<body>
<div id="print-root" aria-hidden="true"></div>
<noscript>Bridge needs JavaScript. For help finding services in Orange County, call 2-1-1. In an emergency, call 9-1-1.</noscript>
</body>
</html>
