# Xcode project spec. Regenerate the .xcodeproj with:  cd iosApp && xcodegen
name: iosApp
options:
  bundleIdPrefix: org.bridge
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Bridge
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: Bridge
        PRODUCT_BUNDLE_IDENTIFIER: org.bridge.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "ComposeApp"]
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          # Xcode doesn't inherit your shell's JAVA_HOME, so find a JDK 17-25 for Gradle.
          usable() { [ -x "$1/bin/java" ] && "$1/bin/java" -version 2>&1 | grep -qE 'version "(1[7-9]|2[0-5])'; }
          if ! usable "$JAVA_HOME"; then
            for candidate in \
              /opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home \
              /opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home \
              "$(/usr/libexec/java_home -v 21 2>/dev/null)" \
              "$(/usr/libexec/java_home -v 17 2>/dev/null)" \
              "/Applications/Android Studio.app/Contents/jbr/Contents/Home"; do
              if usable "$candidate"; then export JAVA_HOME="$candidate"; break; fi
            done
          fi
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
